name: Deploy to Azure

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Azure deployment environment
        required: true
        default: uat
        type: choice
        options: [uat, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'uat' }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22.13.x
  ASPIRE_CLI_VERSION: 13.5.4
  DEPLOYMENT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'uat' }}
  ASPNETCORE_ENVIRONMENT: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && 'Production' || 'Staging' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore modular_mlm.slnx
      - run: dotnet build modular_mlm.slnx --configuration Release --no-restore
      - run: dotnet test modular_mlm.slnx --configuration Release --no-build
      - run: npm ci
        working-directory: web
      - run: npm run release:check
        working-directory: web

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'uat' }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      ORGANIZATION_SLUG: ${{ vars.ORGANIZATION_SLUG || 'default' }}
      SEED_ADMINISTRATOR_EMAIL: ${{ vars.SEED_ADMINISTRATOR_EMAIL }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      PUBLIC_ADMIN_BASE_URL: ${{ vars.PUBLIC_ADMIN_BASE_URL }}
      PUBLIC_STOREFRONT_BASE_URL: ${{ vars.PUBLIC_STOREFRONT_BASE_URL }}
      Parameters__seed-administrator-password: ${{ secrets.SEED_ADMINISTRATOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Sign in to Azure using workload identity federation
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      - name: Verify Azure resource group access
        run: az group show --name "$AZURE_RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" --output none
      - name: Validate public deployment URLs
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for variable_name in \
            PUBLIC_API_BASE_URL \
            PUBLIC_ADMIN_BASE_URL \
            PUBLIC_STOREFRONT_BASE_URL
          do
            if [[ -z "${!variable_name:-}" ]]; then
              missing+=("$variable_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub environment variables in '$DEPLOYMENT_ENVIRONMENT': ${missing[*]}" >&2
            echo "Add them under Settings > Environments > $DEPLOYMENT_ENVIRONMENT > Environment variables." >&2
            exit 1
          fi

          for variable_name in \
            PUBLIC_API_BASE_URL \
            PUBLIC_ADMIN_BASE_URL \
            PUBLIC_STOREFRONT_BASE_URL
          do
            value="${!variable_name}"
            if [[ ! "$value" =~ ^https:// ]] || [[ "$value" =~ localhost|127\.0\.0\.1 ]]; then
              echo "$variable_name must be a public HTTPS origin without a localhost address." >&2
              exit 1
            fi
          done
      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"
      - name: Restore Aspire deployment state
        uses: actions/cache@v5
        with:
          path: ~/.aspire/deployments
          key: aspire-${{ env.DEPLOYMENT_ENVIRONMENT }}-${{ hashFiles('src/AppHost/AppHost.csproj') }}-${{ github.ref_name }}
          restore-keys: |
            aspire-${{ env.DEPLOYMENT_ENVIRONMENT }}-${{ hashFiles('src/AppHost/AppHost.csproj') }}-
            aspire-${{ env.DEPLOYMENT_ENVIRONMENT }}-
      - name: Deploy application and infrastructure
        run: aspire deploy --apphost src/AppHost/AppHost.csproj --environment "$DEPLOYMENT_ENVIRONMENT" --non-interactive
      - name: Configure public marketplace assets
        shell: bash
        run: |
          set -euo pipefail

          storage_account="$(
            az storage account list \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?contains(name, 'objectstorage')].name | [0]" \
              --output tsv
          )"

          if [[ -z "$storage_account" ]]; then
            echo "ERROR: Aspire object-storage account was not found." >&2
            az storage account list \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[].name" \
              --output tsv >&2
            exit 1
          fi

          az storage account update \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$storage_account" \
            --allow-blob-public-access true \
            --output none

          # Azure documents up to 30 seconds of propagation after changing the
          # account-level anonymous access setting. Apply the container ACL only
          # after that window so ARM does not return PublicAccessNotPermitted.
          sleep 30

          container_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$storage_account/blobServices/default/containers/marketplace-assets"
          az resource update \
            --ids "$container_id" \
            --api-version 2023-05-01 \
            --set properties.publicAccess=Blob \
            --output none

          echo "Configured marketplace-assets for anonymous blob read access."

  migrate:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'uat' }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Sign in to Azure using workload identity federation
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      - name: Run EF Core migration job
        shell: bash
        run: |
          set -euo pipefail

          echo "Container Apps jobs deployed in resource group:"
          az containerapp job list \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[].{Name:name,Tags:tags,State:properties.provisioningState}" \
            --output table

          job_name="$(
            az containerapp job list \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?contains(name, 'database-migrator')].name | [0]" \
              --output tsv
          )"

          if [[ -z "$job_name" ]]; then
            echo "ERROR: database-migrator Container Apps Job was not found." >&2
            echo "Available jobs:" >&2

            az containerapp job list \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[].name" \
              --output tsv >&2

            exit 1
          fi

          echo "Found migration job: $job_name"

          execution="$(
            az containerapp job start \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$job_name" \
              --query name \
              --output tsv
          )"

          echo "Started migration execution: $execution"

          for attempt in {1..60}; do
            status="$(
              az containerapp job execution show \
                --subscription "$AZURE_SUBSCRIPTION_ID" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$job_name" \
                --job-execution-name "$execution" \
                --query properties.status \
                --output tsv
            )"

            echo "Migration status: $status"

            case "$status" in
              Succeeded)
                echo "Database migration completed successfully."
                exit 0
                ;;

              Failed|Stopped|Degraded)
                echo "Migration failed with status: $status" >&2

                echo "Execution details:"
                az containerapp job execution show \
                  --subscription "$AZURE_SUBSCRIPTION_ID" \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$job_name" \
                  --job-execution-name "$execution" \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Migration did not complete within 10 minutes." >&2
          exit 1

  verify-uat:
    needs: migrate
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.environment == 'uat') }}
    runs-on: ubuntu-latest
    environment: uat
    env:
      E2E_REAL_STACK: "1"
      E2E_STOREFRONT_URL: ${{ vars.PUBLIC_STOREFRONT_BASE_URL }}
      E2E_AGENT_URL: ${{ vars.PUBLIC_AGENT_BASE_URL }}
      E2E_ADMIN_URL: ${{ vars.PUBLIC_ADMIN_BASE_URL }}
      E2E_CUSTOMER_EMAIL: ${{ vars.E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_AGENT_EMAIL: ${{ vars.E2E_AGENT_EMAIL }}
      E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_FOREIGN_ORGANIZATION_ID: ${{ vars.E2E_FOREIGN_ORGANIZATION_ID }}
      E2E_REFERRAL_CODE: ${{ vars.E2E_REFERRAL_CODE }}
      E2E_PRODUCT_SLUG: ${{ vars.E2E_PRODUCT_SLUG }}
      E2E_PAID_ORDER_ID: ${{ vars.E2E_PAID_ORDER_ID }}
      E2E_CANCELLABLE_ORDER_ID: ${{ vars.E2E_CANCELLABLE_ORDER_ID }}
      E2E_REFUNDABLE_ORDER_ID: ${{ vars.E2E_REFUNDABLE_ORDER_ID }}
      E2E_PAYOUT_AMOUNT: ${{ vars.E2E_PAYOUT_AMOUNT }}
      E2E_PENDING_AGENT_CODE: ${{ vars.E2E_PENDING_AGENT_CODE }}
      E2E_ADMIN_REFUNDABLE_ORDER_NUMBER: ${{ vars.E2E_ADMIN_REFUNDABLE_ORDER_NUMBER }}
      E2E_ADMIN_PAYMENT_REFUND_AMOUNT: ${{ vars.E2E_ADMIN_PAYMENT_REFUND_AMOUNT }}
      E2E_UNPLACED_AGENT_CODE: ${{ vars.E2E_UNPLACED_AGENT_CODE }}
      E2E_PLACEMENT_PARENT_AGENT_CODE: ${{ vars.E2E_PLACEMENT_PARENT_AGENT_CODE }}
      E2E_PENDING_PAYOUT_ACCOUNT_AGENT_CODE: ${{ vars.E2E_PENDING_PAYOUT_ACCOUNT_AGENT_CODE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify deployed UAT workflows
        run: npm run test:e2e:real
        working-directory: web
